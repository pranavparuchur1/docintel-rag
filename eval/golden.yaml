# Golden question set — 50 questions (42 in-corpus, 8 out-of-corpus).
#
# HONESTY CONTRACT:
# - Drafted with LLM assistance, anchored to phrases mechanically confirmed to
#   exist in the corpus (`docintel check-golden` fails on any spec matching 0
#   chunks).
# - `verified: true` is set ONLY after a human has read the question against
#   the actual filing and confirmed the expected source genuinely answers it.
#   The eval report prints the verified count; unverified questions are a
#   stated limitation, not a hidden one.
#
# Spec semantics (src/docintel/eval/golden.py): a chunk is relevant iff it
# matches ALL declared fields of at least one spec. With require: all (default)
# recall@k gives partial credit per spec — cross-company/temporal questions
# need EVERY source covered for full credit. require: any marks specs as
# alternates: retrieving any one of them fully answers the question.

